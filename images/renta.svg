<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Camión de entrega y renta de tarimas">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8844f"/>
      <stop offset="100%" stop-color="#7a5a32"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#night)"/>
  <rect x="0" y="420" width="900" height="180" fill="#1c1c1e"/>
  <g transform="translate(140 200)">
    <rect x="0" y="120" width="420" height="140" rx="12" fill="#3a3a3c"/>
    <rect x="420" y="160" width="200" height="100" rx="8" fill="#48484a"/>
    <rect x="30" y="60" width="360" height="70" fill="#636366" rx="4"/>
    <g transform="translate(50 20)">
      <rect width="300" height="18" fill="url(#wood)"/>
      <rect y="26" width="300" height="18" fill="url(#wood)"/>
      <rect y="52" width="300" height="18" fill="url(#wood)"/>
    </g>
    <circle cx="120" cy="270" r="42" fill="#1c1c1e" stroke="#86868b" stroke-width="8"/>
    <circle cx="520" cy="270" r="42" fill="#1c1c1e" stroke="#86868b" stroke-width="8"/>
    <rect x="640" y="200" width="80" height="60" fill="#2997ff" opacity="0.8" rx="4"/>
  </g>
  <text x="450" y="520" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#a1a1a6">Entrega y recolección incluidas</text>
</svg>
